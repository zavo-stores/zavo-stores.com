<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAVO - Admin Dashboard</title>
    <style>
        :root {
            --zavo-blue: #0f4c81;
            --zavo-yellow: #ffb703;
            --zavo-dark: #1e293b;
            --zavo-light: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--zavo-light); color: var(--zavo-dark); padding: 16px; }
        header { background-color: var(--zavo-blue); color: white; padding: 12px 16px; margin: -16px -16px 20px -16px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: 800; color: white; text-decoration: none; }
        .logo span { color: var(--zavo-yellow); }
        .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; }
        h2 { font-size: 16px; margin-bottom: 12px; color: var(--zavo-blue); }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        button { width: 100%; background: var(--zavo-blue); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; }
        button:hover { background: #0c3d68; }
        .status-msg { margin-top: 10px; font-size: 13px; font-weight: 600; text-align: center; }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">ZAVO <span>Admin</span></a>
        <a href="/" style="color: var(--zavo-yellow); text-decoration: none; font-weight: 600; font-size: 13px;">View Store</a>
    </header>

    <!-- Quick Add Product Form -->
    <div class="card">
        <h2>Add New Product to Store</h2>
        <form id="addProductForm">
            <div class="form-group">
                <label>Product Title</label>
                <input type="text" id="title" placeholder="e.g. Wireless Bluetooth Earbuds" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="description" rows="2" placeholder="Product details..."></textarea>
            </div>
            <div class="form-group">
                <label>Price (KES)</label>
                <input type="number" id="price" placeholder="1500" required>
            </div>
            <div class="form-group">
                <label>Stock Count</label>
                <input type="number" id="stock" value="10" required>
            </div>
            <button type="submit">Publish Product</button>
        </form>
        <div id="statusMsg" class="status-msg"></div>
    </div>

    <script>
        document.getElementById('addProductForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusDiv = document.getElementById('statusMsg');
            statusDiv.style.color = '#64748b';
            statusDiv.textContent = 'Publishing product...';

            const payload = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                price: parseFloat(document.getElementById('price').value),
                stock: parseInt(document.getElementById('stock').value),
                vendor_id: 'sys_admin_01'
            };

            try {
                const res = await fetch('/api/products/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.success) {
                    statusDiv.style.color = 'green';
                    statusDiv.textContent = 'Product successfully published!';
                    document.getElementById('addProductForm').reset();
                } else {
                    statusDiv.style.color = 'red';
                    statusDiv.textContent = 'Error: ' + data.error;
                }
            } catch (err) {
                statusDiv.style.color = 'red';
                statusDiv.textContent = 'Failed to connect to API.';
            }
        });
    </script>

</body>
</html>
