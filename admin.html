<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAVO - Admin Dashboard</title>
    <style>
        :root {
            --zavo-blue: #0f4c81;
            --zavo-yellow: #ffb703;
            --zavo-dark: #1e293b;
            --zavo-light: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--zavo-light); color: var(--zavo-dark); padding: 16px; }
        header { background-color: var(--zavo-blue); color: white; padding: 12px 16px; margin: -16px -16px 20px -16px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: 800; color: white; text-decoration: none; }
        .logo span { color: var(--zavo-yellow); }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; }
        h2 { font-size: 16px; margin-bottom: 12px; color: var(--zavo-blue); }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        button { width: 100%; background: var(--zavo-blue); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; }
        button:hover { background: #0c3d68; }
        .status-msg { margin-top: 10px; font-size: 13px; font-weight: 600; text-align: center; }
        .greeting { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: var(--zavo-blue); }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">ZAVO <span>Admin Dashboard</span></a>
        <a href="/" style="color: var(--zavo-yellow); text-decoration: none; font-weight: 600; font-size: 13px;">View Store</a>
    </header>

    <div class="greeting" id="adminGreeting">Loading admin session...</div>

    <!-- Quick Add Product Form with Multi-Media Support -->
    <div class="card">
        <h2>Publish Product (Up to 10 Images &amp; 5 Videos)</h2>
        <form id="addProductForm">
            <div class="form-group">
                <label>Product Title</label>
                <input type="text" id="title" placeholder="e.g. Wireless Bluetooth Earbuds" required>
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="category">
                    <option value="Electronics">Electronics &amp; Solar</option>
                    <option value="Fashion">Fashion &amp; Apparel</option>
                    <option value="Home">Home &amp; Living</option>
                    <option value="General">General</option>
                </select>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="description" rows="3" placeholder="Detailed product description..." required></textarea>
            </div>
            <div class="form-group">
                <label>Price (KES)</label>
                <input type="number" id="price" placeholder="1500" min="1" required>
            </div>
            <div class="form-group">
                <label>Stock Count</label>
                <input type="number" id="stock" value="10" min="0" required>
            </div>
            <div class="form-group">
                <label>Product Image URLs (Comma-separated HTTPS URLs, up to 10)</label>
                <input type="text" id="images" placeholder="https://.../img1.jpg, https://.../img2.jpg" required>
            </div>
            <button type="submit">Publish Product</button>
        </form>
        <div id="statusMsg" class="status-msg"></div>
    </div>

    <script>
        // Time & Location Greeting Logic
        function setAdminGreeting() {
            const hour = new Date().getHours();
            let timeGreeting = "Good morning";
            if (hour >= 12 && hour < 17) timeGreeting = "Good afternoon";
            else if (hour >= 17) timeGreeting = "Good evening";

            document.getElementById('adminGreetingClub') || 
            (document.getElementById('adminGreeting').textContent = `${timeGreeting}, Sylvester 🌅 (Kenya Time EAT)`);
        }
        setAdminGreeting();

        let csrfToken = '';

        async function initAdmin() {
            try {
                const csrfRes = await fetch('/api/auth/csrf');
                const csrfData = await csrfRes.json();
                if (csrfData.success) csrfToken = csrfData.csrfToken;

                const meRes = await fetch('/api/auth/me');
                const meData = await meRes.json();
                if (!meRes.ok || meData.user.email !== 'sylvesterowinoowino31@gmail.com') {
                    alert('Access restricted to authorized administrator.');
                    window.location.replace('/login.html');
                }
            } catch (err) {
                console.error('Session verification error', err);
            }
        }
        initAdmin();

        document.getElementById('addProductForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusDiv = document.getElementById('statusMsg');
            statusDiv.style.color = '#64748b';
            statusDiv.textContent = 'Publishing product...';

            const imageUrls = document.getElementById('images').value
                .split(',')
                .map(url => url.trim())
                .filter(url => url.length > 0);

            if (imageUrls.length === 0 || imageUrls.length > 10) {
                statusDiv.style.color = 'red';
                statusDiv.textContent = 'Error: Please provide between 1 and 10 image URLs.';
                return;
            }

            const payload = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                category: document.getElementById('category').value,
                price: parseFloat(document.getElementById('price').value),
                stock: parseInt(document.getElementById('stock').value),
                images: imageUrls,
                vendor_id: 'sys_admin_01'
            };

            try {
                const res = await fetch('/api/vendor/products', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': csrfToken
                    },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.success) {
                    statusDiv.style.color = 'green';
                    statusDiv.textContent = 'Product successfully published to marketplace!';
                    document.getElementById('addProductForm').reset();
                } else {
                    statusDiv.style.color = 'red';
                    statusDiv.textContent = 'Error: ' + data.error;
                }
            } catch (err) {
                statusDiv.style.color = 'red';
                statusDiv.textContent = 'Failed to connect to API.';
            }
        });
    </script>

</body>
</html>
