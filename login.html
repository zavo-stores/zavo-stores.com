
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Sign in securely to your ZAVO marketplace account.">
  <title>ZAVO | Account Access</title>

  <style>
    :root {
      --yellow: #ffb703;
      --dark: #0f172a;
      --panel: #1e293b;
      --gray: #94a3b8;
      --red: #f87171;
      --green: #34d399;
      --border: #475569;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--dark);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Arial, sans-serif;
    }

    button, input { font: inherit; }

    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      background: var(--panel);
      border: 1px solid #334155;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,.3);
    }

    .logo {
      display: block;
      margin-bottom: 14px;
      color: white;
      text-align: center;
      text-decoration: none;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .logo span, h1 { color: var(--yellow); }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 22px;
    }

    .intro {
      margin: 0 0 22px;
      color: #cbd5e1;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
    }

    .field { margin-bottom: 15px; }

    label {
      display: block;
      margin-bottom: 6px;
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 650;
    }

    input {
      width: 100%;
      min-height: 44px;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      background: var(--dark);
      color: white;
      font-size: 15px;
    }

    input::placeholder { color: var(--gray); opacity: 1; }

    input:focus-visible {
      border-color: var(--yellow);
      outline: 2px solid rgba(255,183,3,.3);
      outline-offset: 1px;
    }

    .password-wrap {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }

    .password-wrap input { flex: 1; min-width: 0; }

    .toggle-password {
      padding: 0 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #334155;
      color: white;
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
    }

    .btn-submit {
      width: 100%;
      min-height: 46px;
      margin-top: 4px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: var(--yellow);
      color: #111827;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-submit:disabled {
      cursor: wait;
      opacity: .7;
    }

    #msg {
      min-height: 20px;
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #msg.error { color: var(--red); }
    #msg.success { color: var(--green); }
    #msg.info { color: #cbd5e1; }

    .nav-link {
      display: block;
      margin-top: 18px;
      color: var(--gray);
      text-align: center;
      text-decoration: none;
      font-size: 13px;
      line-height: 1.7;
    }

    .nav-link:hover { color: white; }

    .security-note {
      margin: 18px 0 0;
      color: var(--gray);
      text-align: center;
      font-size: 11px;
      line-height: 1.5;
    }

    @media (max-width: 360px) {
      .auth-card { padding: 22px 18px; }
      .password-wrap { flex-wrap: wrap; }
      .toggle-password { min-height: 40px; }
    }
  </style>
</head>

<body>
  <main class="auth-card">
    <a class="logo" href="/zavo-stores.com/" aria-label="ZAVO home">
      ZAVO<span>.</span>
    </a>

    <h1>Account Access</h1>
    <p class="intro">Sign in to access your ZAVO marketplace account.</p>

    <form id="authForm" autocomplete="on">
      <div class="field">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          maxlength="254"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            maxlength="128"
            required
          >
          <button
            class="toggle-password"
            id="togglePassword"
            type="button"
            aria-controls="password"
            aria-pressed="false"
          >Show</button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitButton">
        Sign In
      </button>
    </form>

    <div id="msg" role="status" aria-live="polite"></div>

    <a href="/zavo-stores.com/register.html" class="nav-link">
      New to ZAVO? Create an account
    </a>

    <a href="/zavo-stores.com/" class="nav-link">
      ← Return to the ZAVO storefront
    </a>

    <p class="security-note">
      For your security, never share your password or one-time verification codes.
    </p>
  </main>

  <script>
    (() => {
      "use strict";

      const API_BASE = "https://zavo-api.zavo-stores.workers.dev";
      const LOGIN_ENDPOINT = `${API_BASE}/api/auth/login`;
      const ME_ENDPOINT = `${API_BASE}/api/auth/me`;
      const STOREFRONT_BASE = "/zavo-stores.com/";

      const form = document.getElementById("authForm");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const submitButton = document.getElementById("submitButton");
      const togglePassword = document.getElementById("togglePassword");
      const msg = document.getElementById("msg");

      function showMessage(message, type = "info") {
        msg.textContent = message;
        msg.className = type;
      }

      async function readJsonResponse(response, label) {
        const raw = await response.text();

        let data;

        try {
          data = JSON.parse(raw);
        } catch {
          throw new Error(
            `${label} returned a non-JSON response (HTTP ${response.status}). ` +
            "Check the API URL, Worker routes and Cloudflare logs."
          );
        }

        if (!data || typeof data !== "object") {
          throw new Error(`${label} returned an invalid response.`);
        }

        return data;
      }

      function safeDestination(value) {
        if (typeof value !== "string") return STOREFRONT_BASE;

        // Never redirect to an external or protocol-relative destination.
        if (
          value === "/" ||
          value === STOREFRONT_BASE
        ) {
          return STOREFRONT_BASE;
        }

        if (
          value.startsWith("/zavo-stores.com/") &&
          !value.startsWith("//") &&
          !value.includes("\\")
        ) {
          return value;
        }

        return STOREFRONT_BASE;
      }

      togglePassword.addEventListener("click", () => {
        const reveal = passwordInput.type === "password";

        passwordInput.type = reveal ? "text" : "password";
        togglePassword.textContent = reveal ? "Hide" : "Show";
        togglePassword.setAttribute("aria-pressed", String(reveal));
      });

      form.addEventListener("submit", async event => {
        event.preventDefault();

        if (!form.reportValidity()) return;

        const email = emailInput.value.trim().toLowerCase();
        const password = passwordInput.value;

        if (!email || !password) {
          showMessage("Enter your email address and password.", "error");
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "Signing in…";
        showMessage("Connecting securely to ZAVO…", "info");

        try {
          let response;

          try {
            response = await fetch(LOGIN_ENDPOINT, {
              method: "POST",
              mode: "cors",
              credentials: "include",
              cache: "no-store",
              headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
              },
              body: JSON.stringify({ email, password })
            });
          } catch (networkError) {
            throw new Error(
              "Could not connect to the ZAVO login API. Check your internet " +
              "connection and the Worker CORS settings."
            );
          }

          const data = await readJsonResponse(response, "Login API");

          if (!response.ok || data.success !== true) {
            throw new Error(
              typeof data.error === "string"
                ? data.error
                : `Sign-in failed (HTTP ${response.status}).`
            );
          }

          showMessage("Checking your sign-in session…", "info");

          let sessionResponse;

          try {
            sessionResponse = await fetch(ME_ENDPOINT, {
              method: "GET",
              mode: "cors",
              credentials: "include",
              cache: "no-store",
              headers: { "Accept": "application/json" }
            });
          } catch {
            throw new Error(
              "Your login request succeeded, but the session check could not " +
              "connect. Check Worker CORS settings and network access."
            );
          }

          const sessionData = await readJsonResponse(
            sessionResponse,
            "Session check"
          );

          if (!sessionResponse.ok || sessionData.success !== true) {
            throw new Error(
              "The login API accepted the request, but the session was not " +
              "retained. Your browser may be blocking cross-site cookies. " +
              "A same-site custom domain setup may be needed."
            );
          }

          showMessage("Sign-in successful. Redirecting…", "success");

          window.location.assign(
            safeDestination(data.redirectTo)
          );

        } catch (error) {
          console.error("ZAVO sign-in error:", error);

          showMessage(
            error instanceof Error
              ? error.message
              : "Unable to sign in. Please try again.",
            "error"
          );
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "Sign In";
        }
      });
    })();
  </script>
</body>
</html>
