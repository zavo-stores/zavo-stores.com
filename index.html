<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f4c81">
  <meta name="description" content="Shop products from ZAVO marketplace vendors and discover great deals in Kenya.">
  <title>ZAVO | Multi-Vendor Marketplace</title>

  <style>
    :root {
      --blue: #0f4c81;
      --yellow: #ffb703;
      --dark: #1e293b;
      --light: #f8fafc;
      --gray: #64748b;
      --green: #059669;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * { box-sizing: border-box; }
    html { color-scheme: light; }

    body {
      margin: 0;
      padding: 0 0 calc(76px + env(safe-area-inset-bottom));
      background: var(--light);
      color: var(--dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }

    .site-header {
      position: sticky; top: 0; z-index: 10; padding: 12px 16px;
      color: white; background: var(--blue); box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    .header-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
    .logo { color: white; font-size: 24px; font-weight: 900; letter-spacing: 1px; }
    .logo span { color: var(--yellow); }
    .auth-links { display: flex; gap: 7px; }
    .btn-auth { padding: 9px 12px; border-radius: 20px; background: var(--yellow); color: var(--dark); font-size: 12px; font-weight: 800; }
    .btn-auth.secondary { background: white; color: var(--blue); }

    .search-container { display: flex; align-items: center; padding: 4px 12px; border-radius: 25px; background: white; }
    .search-container input { width: 100%; padding: 9px 4px; border: 0; outline: 0; background: transparent; }

    .hero { margin-bottom: 18px; padding: 26px 16px; text-align: center; color: white; background: linear-gradient(135deg, var(--blue), #1e3a8a); }
    .hero h1 { margin: 0 0 8px; font-size: clamp(21px, 5vw, 28px); }
    .hero p { margin: 0; color: #e2e8f0; font-size: 14px; }

    main { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
    .section-title { display: flex; justify-content: space-between; align-items: center; margin: 0 0 12px; font-size: 18px; }
    .cart-link { color: var(--blue); font-weight: 700; }
    .cart-count { display: inline-flex; min-width: 20px; height: 20px; padding: 0 5px; margin-left: 3px; align-items: center; justify-content: center; border-radius: 999px; color: var(--dark); background: var(--yellow); font-size: 11px; }

    .product-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .product-card {
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 12px; border: 1px solid var(--border); border-radius: var(--radius);
      background: white; box-shadow: 0 1px 3px rgba(0,0,0,.06); cursor: pointer; transition: transform 0.2s;
    }
    .product-card:hover { transform: translateY(-2px); }

    .product-image {
      width: 100%; height: 150px; object-fit: contain; margin-bottom: 9px; border-radius: 8px; background: #f1f5f9;
    }
    .product-title { margin: 0 0 4px; font-size: 14px; font-weight: 700; color: var(--dark); }
    
    /* Exact sample specification: Green Currency & Amount */
    .product-price { margin-bottom: 6px; color: var(--green); font-size: 16px; font-weight: 800; }
    .product-desc { font-size: 12px; color: var(--gray); margin-bottom: 8px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    
    .product-rating { font-size: 12px; color: #d97706; margin-bottom: 8px; font-weight: 600; }
    .product-review { font-size: 11px; font-style: italic; color: #475569; margin-bottom: 10px; background: #f8fafc; padding: 6px; border-radius: 6px; }

    .btn-add-cart { width: 100%; padding: 10px; border: 0; border-radius: 7px; color: white; background: var(--blue); font-size: 13px; font-weight: 700; cursor: pointer; }
    .btn-add-cart:hover { background: #0c3d68; }

    /* Product Detail Modal for Multi-Images (up to 10) & Videos (up to 5) */
    #productModal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7);
      display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px;
    }
    .modal-content {
      background: white; border-radius: 12px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 20px; position: relative;
    }
    .close-modal { position: absolute; top: 12px; right: 16px; font-size: 22px; font-weight: bold; cursor: pointer; color: var(--gray); }
    .gallery-container { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 4px; }
    .gallery-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 2px solid transparent; cursor: pointer; }
    .gallery-thumb.active { border-color: var(--blue); }
    .main-preview { width: 100%; height: 240px; object-fit: contain; background: #f1f5f9; border-radius: 8px; margin-bottom: 12px; }
    .modal-video { width: 100%; max-height: 240px; border-radius: 8px; margin-bottom: 12px; background: #000; }

    .mobile-nav {
      position: fixed; right: 0; bottom: 0; left: 0; display: flex; justify-content: space-around;
      padding: 10px 4px calc(10px + env(safe-area-inset-bottom)); background: white; border-top: 1px solid var(--border); z-index: 20;
    }
    .nav-item { flex: 1; text-align: center; color: var(--gray); font-size: 11px; font-weight: 650; }
    .nav-item.active { color: var(--blue); }

    @media (min-width: 620px) {
      .product-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-top">
      <a href="/" class="logo">ZAVO<span>.</span></a>
      <div class="auth-links">
        <a href="/login.html" class="btn-auth secondary">Sign In</a>
        <a href="/register.html" class="btn-auth">Create Account</a>
      </div>
    </div>
    <form class="search-container" id="searchForm" role="search">
      <input type="search" id="searchInput" placeholder="Search products, vendors or categories...">
    </form>
  </header>

  <section class="hero">
    <h1>Great Deals, Delivered.</h1>
    <p>Explore verified products from trusted vendors across Kenya.</p>
  </section>

  <main>
    <div class="section-title">
      <h2>Featured Products</h2>
      <a class="cart-link" href="/checkout.html">Cart <span id="cartCount" class="cart-count">0</span></a>
    </div>

    <div id="productGrid" class="product-grid">
      <div style="grid-column: 1/-1; text-align:center; padding: 40px; color: var(--gray);">Loading ZAVO products...</div>
    </div>
  </main>

  <!-- Product Details & Media Gallery Modal -->
  <div id="productModal">
    <div class="modal-content">
      <span class="close-modal" id="closeModal">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <nav class="mobile-nav">
    <a href="/" class="nav-item active">Shop</a>
    <a href="/vendor.html" class="nav-item">Vendors</a>
    <a href="/reseller.html" class="nav-item">Resellers</a>
    <a href="/checkout.html" class="nav-item">Cart</a>
  </nav>

  <script>
    const API_BASE = "https://zavo-api.zavo-stores.workers.dev"; // Or relative path if unified
    let allProducts = [];

    async function loadProducts() {
      try {
        const res = await fetch(`${API_BASE}/api/products`);
        const data = await res.json();
        if (data.success && Array.isArray(data.products)) {
          allProducts = data.products;
          renderProducts(allProducts);
        }
      } catch (err) {
        document.getElementById('productGrid').innerHTML = '<div style="grid-column:1/-1; text-align:center; color:red;">Failed to load products. Check connection.</div>';
      }
    }

    function renderProducts(products) {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';
      if (products.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:var(--gray);">No products found.</div>';
        return;
      }

      products.forEach(p => {
        let images = [];
        try { images = JSON.parse(p.images || '[]'); } catch { images = [p.images]; }
        const primaryImg = images[0] || 'https://via.placeholder.com/200';

        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div>
            <img src="${primaryImg}" class="product-image" alt="${p.title}" loading="lazy">
            <h3 class="product-title">${p.title}</h3>
            <div class="product-price">KSh ${Number(p.price).toLocaleString()}</div>
            <div class="product-desc">${p.description || ''}</div>
            <div class="product-rating">★★★★☆ (${p.rating || 4}/5)</div>
            <div class="product-review">"${p.reviews || 'Clear sound and comfortable fit.'}"</div>
          </div>
          <button class="btn-add-cart" onclick="event.stopPropagation(); addToCart('${p.id}')">Add to Cart</button>
        `;
        card.addEventListener('click', () => openProductModal(p));
        grid.appendChild(card);
      });
    }

    function openProductModal(p) {
      let images = [];
      let videos = [];
      try { images = JSON.parse(p.images || '[]'); } catch { images = [p.images]; }
      try { videos = JSON.parse(p.videos || '[]'); } catch { videos = []; }

      const modalBody = document.getElementById('modalBody');
      modalBody.innerHTML = `
        <h2 style="color:var(--blue); margin-bottom:8px;">${p.title}</h2>
        <div style="color:var(--green); font-size:18px; font-weight:800; margin-bottom:12px;">KSh ${Number(p.price).toLocaleString()}</div>
        
        <img src="${images[0] || ''}" class="main-preview" id="mainPreview">
        
        <div class="gallery-container" id="galleryThumbs">
          ${images.map((img, idx) => `<img src="${img}" class="gallery-thumb ${idx===0?'active':''}" onclick="document.getElementById('mainPreview').src='${img}'; document.querySelectorAll('.gallery-thumb').forEach(t=>t.classList.remove('active')); this.classList.add('active');">`).join('')}
        </div>

        ${videos.length > 0 ? `<h3 style="font-size:14px; margin:12px 0 6px; color:var(--blue);">Product Videos</h3>` : ''}
        ${videos.map(v => `<video src="${v}" controls class="modal-video"></video>`).join('')}

        <p style="font-size:13px; color:var(--dark); line-height:1.5; margin:12px 0;">${p.description}</p>
        <div style="font-size:13px; font-weight:600; color:#d97706; margin-bottom:12px;">Rating: ${p.rating || 4}/5 stars</div>
        <button class="btn-add-cart" onclick="addToCart('${p.id}'); document.getElementById('productModal').style.display='none';">Add to Cart</button>
      `;

      document.getElementById('productModal').style.display = 'flex';
    }

    document.getElementById('closeModal').addEventListener('click', () => {
      document.getElementById('productModal').style.display = 'none';
    });

    function addToCart(id) {
      const product = allProducts.find(p => String(p.id) === String(id));
      if (!product) return;
      let cart = JSON.parse(localStorage.getItem('zavo_cart') || '[]');
      const existing = cart.find(item => String(item.id) === String(id));
      if (existing) existing.quantity += 1;
      else {
        let images = [];
        try { images = JSON.parse(product.images || '[]'); } catch { images = [product.images]; }
        cart.push({ id: product.id, title: product.title, price: product.price, quantity: 1, image: images[0] || '' });
      }
      localStorage.setItem('zavo_cart', JSON.stringify(cart));
      document.getElementById('cartCount').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
      alert(product.title + " added to your cart.");
    }

    // Initialize cart count on load
    document.getElementById('cartCount').textContent = JSON.parse(localStorage.getItem('zavo_cart') || '[]').reduce((sum, item) => sum + item.quantity, 0);

    // Search filter
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = allProducts.filter(p => p.title.toLowerCase().includes(q) || (p.description && p.description.toLowerCase().includes(q)));
      renderProducts(filtered);
    });

    loadProducts();
  </script>
</body>
</html>
