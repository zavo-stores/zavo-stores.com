
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Sign in securely to your ZAVO marketplace account.">
  <title>ZAVO | Account Access</title>

  <style>
    :root {
      --zavo-blue: #0f4c81;
      --zavo-yellow: #ffb703;
      --zavo-dark: #0f172a;
      --zavo-panel: #1e293b;
      --zavo-gray: #94a3b8;
      --zavo-red: #f87171;
      --zavo-green: #34d399;
      --zavo-border: #475569;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--zavo-dark);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Arial, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      background: var(--zavo-panel);
      border: 1px solid #334155;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .logo {
      display: block;
      margin-bottom: 14px;
      color: white;
      text-align: center;
      text-decoration: none;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .logo span {
      color: var(--zavo-yellow);
    }

    h1 {
      margin: 0 0 8px;
      color: var(--zavo-yellow);
      text-align: center;
      font-size: 22px;
    }

    .intro {
      margin: 0 0 22px;
      color: #cbd5e1;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 650;
    }

    input {
      width: 100%;
      min-height: 44px;
      padding: 11px 12px;
      border: 1px solid var(--zavo-border);
      border-radius: 8px;
      outline: none;
      background: #0f172a;
      color: white;
      font-size: 15px;
    }

    input::placeholder {
      color: #94a3b8;
      opacity: 1;
    }

    input:focus-visible {
      border-color: var(--zavo-yellow);
      outline: 2px solid rgba(255, 183, 3, 0.3);
      outline-offset: 1px;
    }

    .password-wrap {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }

    .password-wrap input {
      flex: 1;
      min-width: 0;
    }

    .toggle-password {
      padding: 0 11px;
      border: 1px solid var(--zavo-border);
      border-radius: 8px;
      background: #334155;
      color: white;
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
    }

    .btn-submit {
      width: 100%;
      min-height: 46px;
      margin-top: 4px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: var(--zavo-yellow);
      color: #111827;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-submit:hover:not(:disabled) {
      filter: brightness(0.96);
    }

    .btn-submit:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    #msg {
      min-height: 20px;
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #msg.error {
      color: var(--zavo-red);
    }

    #msg.success {
      color: var(--zavo-green);
    }

    #msg.info {
      color: #cbd5e1;
    }

    .nav-link {
      display: block;
      margin-top: 18px;
      color: var(--zavo-gray);
      text-align: center;
      text-decoration: none;
      font-size: 13px;
    }

    .nav-link:hover {
      color: white;
    }

    .security-note {
      margin: 18px 0 0;
      color: #94a3b8;
      text-align: center;
      font-size: 11px;
      line-height: 1.5;
    }

    @media (max-width: 360px) {
      .auth-card {
        padding: 22px 18px;
      }

      .password-wrap {
        flex-wrap: wrap;
      }

      .toggle-password {
        min-height: 40px;
      }
    }
  </style>
</head>

<body>
  <main class="auth-card">
    <a class="logo" href="/" aria-label="ZAVO home">
      ZAVO<span>.</span>
    </a>

    <h1>Account Access</h1>

    <p class="intro">
      Sign in to access your ZAVO marketplace account.
    </p>

    <form id="authForm" autocomplete="on">
      <div class="field">
        <label for="email">Email address</label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          maxlength="254"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>

        <div class="password-wrap">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            minlength="8"
            maxlength="128"
            required
          >

          <button
            class="toggle-password"
            id="togglePassword"
            type="button"
            aria-controls="password"
            aria-pressed="false"
          >
            Show
          </button>
        </div>
      </div>

      <button
        type="submit"
        class="btn-submit"
        id="submitButton"
      >
        Sign In
      </button>
    </form>

    <div id="msg" role="status" aria-live="polite"></div>

    <a href="/" class="nav-link">
      ← Return to the ZAVO storefront
    </a>

    <p class="security-note">
      For your security, never share your password or one-time verification codes.
    </p>
  </main>

  <script>
    (() => {
      "use strict";

      const LOGIN_ENDPOINT = "/api/auth/login";

      const form = document.getElementById("authForm");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const submitButton = document.getElementById("submitButton");
      const togglePassword = document.getElementById("togglePassword");
      const msg = document.getElementById("msg");

      function showMessage(message, type = "info") {
        msg.textContent = message;
        msg.className = type;
      }

      togglePassword.addEventListener("click", () => {
        const reveal = passwordInput.type === "password";

        passwordInput.type = reveal ? "text" : "password";
        togglePassword.textContent = reveal ? "Hide" : "Show";
        togglePassword.setAttribute("aria-pressed", String(reveal));
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!form.reportValidity()) {
          return;
        }

        const email = emailInput.value.trim().toLowerCase();
        const password = passwordInput.value;

        if (!email || !password) {
          showMessage(
            "Enter your email address and password.",
            "error"
          );
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "Signing in…";

        showMessage("Checking your account…", "info");

        try {
          const response = await fetch(LOGIN_ENDPOINT, {
            method: "POST",
            credentials: "same-origin",
            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json"
            },
            body: JSON.stringify({
              email,
              password
            })
          });

          let data;

          try {
            data = await response.json();
          } catch {
            throw new Error(
              "The server returned an unreadable response. Please try again."
            );
          }

          if (!response.ok || !data || data.success !== true) {
            const serverMessage =
              data && typeof data.error === "string"
                ? data.error
                : "";

            throw new Error(
              serverMessage ||
              "Sign-in failed. Check your details and try again."
            );
          }

          showMessage(
            "Sign-in successful. Redirecting…",
            "success"
          );

          /*
           * SECURITY REQUIREMENTS:
           * The Worker must verify the password, create a secure
           * server-side session, and authorize the user's role.
           *
           * redirectTo must be generated or restricted by the server.
           * Never trust a client-side role or email check for admin access.
           */

          const destination =
            typeof data.redirectTo === "string" &&
            data.redirectTo.startsWith("/") &&
            !data.redirectTo.startsWith("//") &&
            !data.redirectTo.includes("\\")
              ? data.redirectTo
              : "/";

          window.location.assign(destination);

        } catch (error) {
          console.error("ZAVO sign-in error:", error);

          showMessage(
            error instanceof Error
              ? error.message
              : "Unable to sign in. Please try again.",
            "error"
          );

        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "Sign In";
        }
      });
    })();
  </script>
</body>
</html>
